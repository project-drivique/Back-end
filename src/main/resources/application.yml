spring:
  web:
    error:
      include-message: never
      include-stacktrace: never
  application:
    name: drivique-api
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:true}
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:drivique_dev}}
    username: ${DB_USERNAME:drivique_app}
    password: ${DB_PASSWORD:change-me-app-password}
    hikari:
      pool-name: DriviquePool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate

app:
  auth:
    mail-from: ${APP_AUTH_MAIL_FROM:no-reply@drivique.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server:
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Drivique API
    version: '@project.version@'

springdoc:
  api-docs:
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

catalog:
  exchange-rates:
    base-url: ${FRANKFURTER_BASE_URL:https://api.frankfurter.dev}
    timeout-ms: ${FRANKFURTER_TIMEOUT_MS:5000}

compliance:
  # Define each legal version by environment, for example:
  # required-consents[0]: { consent-type: TERMS_AND_CONDITIONS, document-version: 2026-09 }
  required-consents: []

payments:
  wompi:
    public-key: ${WOMPI_PUBLIC_KEY:}
    integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
    event-secret: ${WOMPI_EVENT_SECRET:}
    checkout-url: ${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}

drivique:
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:18960724578-h53pr526uva5mtb9doup86f5hjei231c.apps.googleusercontent.com}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      app-id: ${FACEBOOK_APP_ID:1072551762252390}
      app-secret: ${FACEBOOK_APP_SECRET:}
