<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{TITLE}} · Drivique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-gradient: linear-gradient(135deg, #09132b 0%, #172554 45%, #1e40af 100%);
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
      --emerald-600: #059669;
      --emerald-500: #10b981;
      --rose-600: #dc2626;
      --rose-500: #ef4444;
      --amber-500: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1329;
      background-image:
        radial-gradient(at 50% 0%, rgba(30, 58, 138, 0.45) 0px, transparent 65%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
      color: var(--slate-800);
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .portal-wrapper {
      max-width: 490px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .portal-header {
      background: var(--primary-gradient);
      padding: 28px 24px;
      text-align: center;
      color: #ffffff;
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo-emblem {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;
    }
    .brand-subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #93c5fd;
      margin-top: 6px;
    }
    .portal-body {
      padding: 28px 24px 32px;
    }
    .status-badge-container {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-confirm {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .badge-reject {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .badge-locked {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    .card-title {
      font-size: 21px;
      font-weight: 800;
      color: var(--slate-900);
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .card-subtitle {
      font-size: 14px;
      color: var(--slate-600);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .text-center {
      text-align: center;
    }
    .summary-card {
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 20px;
    }
    .summary-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--slate-200);
    }
    .summary-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--slate-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .code-chip {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }
    .summary-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .summary-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .item-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid var(--slate-200);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--slate-600);
      flex-shrink: 0;
      margin-top: 1px;
    }
    .item-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--slate-500);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .item-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--slate-800);
      line-height: 1.4;
    }
    .plate-chip {
      background: #fef08a;
      color: #854d0e;
      border: 1px solid #fde047;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      margin-left: 4px;
    }
    .phone-link {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }
    .phone-link:hover {
      text-decoration: underline;
    }
    .notice-box {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .notice-confirm {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .notice-reject {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .notice-neutral {
      background: #f8fafc;
      border: 1px solid var(--slate-200);
      color: var(--slate-700);
    }
    .notice-icon {
      flex-shrink: 0;
      margin-top: 2px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }
    .btn-confirm {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 10px 20px -3px rgba(16, 185, 129, 0.4), 0 4px 6px -4px rgba(16, 185, 129, 0.2);
    }
    .btn-confirm:hover:not(:disabled) {
      filter: brightness(1.05);
      box-shadow: 0 14px 24px -3px rgba(16, 185, 129, 0.5);
    }
    .btn-reject {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 10px 20px -3px rgba(239, 68, 68, 0.4), 0 4px 6px -4px rgba(239, 68, 68, 0.2);
    }
    .btn-reject:hover:not(:disabled) {
      filter: brightness(1.05);
      box-shadow: 0 14px 24px -3px rgba(239, 68, 68, 0.5);
    }
    .btn-locked {
      background: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-locked:hover {
      filter: none;
      box-shadow: none;
    }
    .result-icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px auto 20px;
    }
    .result-success {
      background: #ecfdf5;
      border: 2px solid #a7f3d0;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2);
    }
    .result-warning {
      background: #fffbeb;
      border: 2px solid #fde68a;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.2);
    }
    .result-danger {
      background: #fef2f2;
      border: 2px solid #fecaca;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.2);
    }
    .result-info {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.2);
    }
    .safe-close-hint {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate-500);
      background: var(--slate-100);
      padding: 8px 16px;
      border-radius: 20px;
    }
    .portal-footer {
      border-top: 1px solid var(--slate-200);
      background: var(--slate-50);
      padding: 16px 24px;
      text-align: center;
    }
    .secure-note {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--slate-500);
      margin-bottom: 4px;
    }
    .copyright {
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="portal-wrapper">
    <header class="portal-header">
      <h1 class="brand-title">DRIVIQUE</h1>
      <p class="brand-subtitle">{{PORTAL}}</p>
    </header>
    <main class="portal-body">
      {{BODY}}
    </main>
    <footer class="portal-footer">
      <div class="secure-note">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>{{SECURE}}</span>
      </div>
      <div class="copyright">{{RIGHTS}}</div>
    </footer>
  </div>
  <script>
    function handleFormSubmit(form) {
      var btn = form.querySelector('#submitBtn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>{{PROCESSING}}</span>';
      }
    }
  </script>
</body>
</html>
