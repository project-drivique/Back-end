name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - qa
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verificar compilacion y pruebas
        run: ./mvnw verify
