name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify against PostgreSQL 17 with Testcontainers
        run: |
          ./mvnw --batch-mode clean verify || {
            echo "================================================================"
            echo "                 SUREFIRE TEST FAILURE REPORTS                  "
            echo "================================================================"
            for f in target/surefire-reports/*.txt; do
              if [ -f "$f" ]; then
                echo "=== FILE: $f ==="
                cat "$f"
              fi
            done
            for d in target/surefire-reports/*dump*; do
              if [ -f "$d" ]; then
                echo "=== DUMP: $d ==="
                cat "$d"
              fi
            done
            exit 1
          }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
