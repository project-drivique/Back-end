name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify against PostgreSQL 17 with Testcontainers
        run: ./mvnw --batch-mode clean verify -DtrimStackTrace=false

      - name: Show full surefire failures
        if: failure()
        run: |
          shopt -s nullglob
          {
            echo "## Cadena de 'Caused by' (causa raiz al final de cada bloque)"
            echo '```'
            grep -h "Caused by:" target/surefire-reports/*.txt | awk '!seen[$0]++' | cut -c1-600
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for f in target/surefire-reports/*.txt; do
            if grep -qE "FAILURE|ERROR" "$f"; then
              echo "::group::$(basename "$f")"
              cat "$f"
              echo "::endgroup::"
            fi
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
