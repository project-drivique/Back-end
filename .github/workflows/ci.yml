name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify against PostgreSQL 17 with Testcontainers
        run: |
          ./mvnw --batch-mode clean verify || {
            for f in target/surefire-reports/*.txt; do
              if [ -f "$f" ] && grep -q "FAILURE\|ERROR" "$f"; then
                grep -A 10 "Caused by:" "$f" | head -n 30 | while IFS= read -r line; do
                  echo "::error title=$(basename "$f")::$line"
                done
              fi
            done
            exit 1
          }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
