name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify against PostgreSQL 17 with Testcontainers
        run: ./mvnw --batch-mode clean verify
      - name: Print failure test logs
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            if [ -f "$f" ]; then
              echo "======================================"
              echo "REPORT: $f"
              echo "======================================"
              cat "$f"
            fi
          done
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
