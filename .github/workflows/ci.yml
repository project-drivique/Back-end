name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Back-end
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout database migrations for Liquibase schema verification
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: project-drivique/database
          path: ../database

      - name: Scan repository for hardcoded secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Sin datos ni proveedores simulados en código productivo
        run: |
          if grep -rnE "MockEmailProvider|mock-email|sandbox_(google|facebook|fb)|mock_google|mock_fb|getOrSeed|seedDefault|seedReportTypes|@Profile\(\"mock" src/main; then
            echo "::error::Hay datos o proveedores simulados en src/main. Los fixtures solo van en src/test."
            exit 1
          fi

      - name: Pre-pull PostgreSQL 17 image
        run: docker pull postgres:17-alpine

      - name: Verify against PostgreSQL 17 with Liquibase and Testcontainers
        run: ./mvnw --batch-mode clean verify -DtrimStackTrace=false

      - name: Show full surefire failures
        if: failure()
        run: |
          shopt -s nullglob
          {
            echo "## Cadena de 'Caused by' (causa raiz al final de cada bloque)"
            echo '```'
            grep -h "Caused by:" target/surefire-reports/*.txt | awk '!seen[$0]++' | cut -c1-600
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for f in target/surefire-reports/*.txt; do
            if [ -f "$f" ] && grep -qE "FAILURE|ERROR" "$f"; then
              echo "::group::$(basename "$f")"
              cat "$f"
              echo "::endgroup::"
            fi
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
