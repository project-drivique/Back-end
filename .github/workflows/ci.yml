name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify against PostgreSQL 17 with Testcontainers
        run: |
          ./mvnw --batch-mode clean verify || {
            grep -rn "Caused by:" target/surefire-reports/ | head -n 30 | while IFS= read -r line; do
              echo "::error title=RootCause::$line"
            done
            grep -rn "Exception:" target/surefire-reports/ | head -n 30 | while IFS= read -r line; do
              echo "::error title=Exception::$line"
            done
            exit 1
          }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
